name: Claude Auto-Debug

# Veille automatique des erreurs, pilotee par GitHub (100 % evenementiel, aucun polling).
#
# Trois declencheurs :
#   1. Un workflow de CI se termine en ECHEC  -> Claude lit les logs, diagnostique
#      la cause racine, ouvre une PR avec un correctif minimal et active le
#      MERGE AUTOMATIQUE : la PR fusionne des que les tests CI repassent au vert,
#      sans attendre de relecture humaine.
#   2. Une issue etiquetee "bug" est ouverte  -> Claude analyse, propose une piste
#      et, s'il est sur de lui, ouvre une PR avec merge automatique (idem cas 1).
#   3. Une mention @claude dans un commentaire -> invocation manuelle a la demande.
#
# Une fois une PR fusionnee sur la branche par defaut, le DEPLOIEMENT suit le
# pipeline CD deja en place sur ce depot (ex : deploiement automatique Vercel
# sur push vers la branche par defaut). Ce workflow ne declenche pas de deploiement
# lui-meme, il se contente de fusionner des que les tests passent.
#
# Prerequis depot (une fois, dans Settings) pour que le merge auto attende
# vraiment les tests plutot que de fusionner immediatement :
#   - Settings -> General -> Pull Requests -> cocher "Allow auto-merge".
#   - Settings -> Branches -> proteger la branche par defaut avec au moins un
#     "required status check" correspondant a ton workflow de CI.
#
# Installation (app Claude GitHub + secret ANTHROPIC_API_KEY) : voir oliviernkh/claude/auto-debug/README.md
# Ce depot n'a pas de workflow de CI/build dedie pour l'instant (seulement Graphify) ;
# adapte la liste `workflows:` ci-dessous si tu en ajoutes un.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-auto-debug-${{ github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  debug-ci-failure:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Claude debugge l'echec de CI
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Le workflow de CI "${{ github.event.workflow_run.name }}" a ECHOUE
            sur la branche "${{ github.event.workflow_run.head_branch }}"
            (run #${{ github.event.workflow_run.id }},
            commit ${{ github.event.workflow_run.head_sha }}).

            Ta mission :
            1. Recupere les logs de l'echec :
               `gh run view ${{ github.event.workflow_run.id }} --log-failed`
            2. Identifie la CAUSE RACINE (pas juste le symptome). Distingue bien :
               - un vrai bug dans le code,
               - un test defaillant/obsolete,
               - un probleme de config/dependance/environnement.
            3. Si tu es CONFIANT dans un correctif minimal et surement correct :
               cree une branche `claude/fix-ci-${{ github.event.workflow_run.id }}`,
               applique le correctif, et ouvre une PR (PAS en mode draft) qui
               explique clairement la cause racine et la correction. Juste apres
               l'avoir ouverte, active le merge automatique avec
               `gh pr merge --auto --squash --delete-branch <numero-ou-url-de-la-PR>`
               afin qu'elle fusionne d'elle-meme des que les checks CI repassent
               au vert, sans attendre de relecture humaine. Si `gh pr merge --auto`
               echoue (auto-merge non active sur le depot, ou aucun check requis
               configure), signale-le clairement dans un commentaire sur la PR
               plutot que d'echouer silencieusement.
            4. Si tu n'es PAS sur (correctif ambigu, refonte necessaire, cause
               externe) : n'ouvre PAS de PR. Redige plutot un diagnostic clair
               et les options possibles, sans deviner.

            Reste minimal et cible : corrige la cause, ne refactorise pas alentour.
            Le deploiement en production suit ensuite le pipeline CD deja en place
            sur ce depot une fois la PR fusionnee ; tu n'as rien d'autre a declencher.
          claude_args: |
            --max-turns 40

  triage-issue:
    if: >
      (github.event_name == 'issues' &&
        (github.event.action == 'opened' || github.event.label.name == 'bug')) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude analyse l'issue
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Une issue potentiellement liee a une erreur/bug est arrivee :
            #${{ github.event.issue.number }} — "${{ github.event.issue.title }}".

            Ta mission :
            1. Lis l'issue et les commentaires : `gh issue view ${{ github.event.issue.number }} --comments`
            2. Determine s'il s'agit bien d'un bug/erreur. Si ce n'en est pas un,
               commente brievement pour le signaler et arrete-toi.
            3. Si c'est un bug : localise la cause racine dans le code.
            4. Si tu es CONFIANT dans un correctif : cree une branche
               `claude/fix-issue-${{ github.event.issue.number }}`, corrige, et ouvre
               une PR (PAS en mode draft) liee a l'issue
               (Closes #${{ github.event.issue.number }}). Juste apres l'avoir
               ouverte, active le merge automatique avec
               `gh pr merge --auto --squash --delete-branch <numero-ou-url-de-la-PR>`
               afin qu'elle fusionne d'elle-meme des que les checks CI repassent
               au vert, sans attendre de relecture humaine. Si `gh pr merge --auto`
               echoue (auto-merge non active sur le depot, ou aucun check requis
               configure), signale-le clairement dans un commentaire sur la PR
               plutot que d'echouer silencieusement.
            5. Sinon : poste un commentaire avec le diagnostic et une solution
               proposee, sans modifier le code.

            Reste minimal et cible. Le deploiement en production suit ensuite le
            pipeline CD deja en place sur ce depot une fois la PR fusionnee ; tu
            n'as rien d'autre a declencher.
          claude_args: |
            --max-turns 40
